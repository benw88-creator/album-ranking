<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="ground" cx="32%" cy="24%" r="92%">
      <stop offset="0%" stop-color="#16130f"/><stop offset="55%" stop-color="#0b0a09"/><stop offset="100%" stop-color="#050404"/>
    </radialGradient>

    <!-- Anodised metal. First and last stop are the same colour, so the sweep
         closes on itself and there is no visible join. -->
    <linearGradient id="chrome" x1="6%" y1="2%" x2="94%" y2="98%">
      <stop offset="0%"   stop-color="#FFDE8A"/>
      <stop offset="16%"  stop-color="#F5B21E"/>
      <stop offset="34%"  stop-color="#F06A4B"/>
      <stop offset="52%"  stop-color="#9B4DE0"/>
      <stop offset="70%"  stop-color="#1FA8E0"/>
      <stop offset="87%"  stop-color="#B8891A"/>
      <stop offset="100%" stop-color="#FFDE8A"/>
    </linearGradient>

    <!-- One specular band across the top left, which is what stops a flat
         gradient reading as plastic. -->
    <linearGradient id="spec" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="26%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>

    <!-- The V, cut out of the disc. Black in a mask means "remove this". -->
    <mask id="cut">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="512" r="404" fill="#fff"/>
      <path d="M 366 342 L 512 658 L 658 342"
            fill="none" stroke="#000" stroke-width="94"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- ONE groove. Not a field of them: a single ring inside the rim is the
           only record detail that is still legible at 60pt, and without it this
           is a circle with a letter in it rather than a record. -->
      <circle cx="512" cy="512" r="370" fill="none" stroke="#000" stroke-width="7" opacity="0.55"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <g mask="url(#cut)">
    <circle cx="512" cy="512" r="404" fill="url(#chrome)"/>
    <circle cx="512" cy="512" r="404" fill="url(#spec)"/>
  </g>
</svg>